<svg xmlns="http://www.w3.org/2000/svg" width="790" height="190" viewBox="0 0 790 190" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">이미지 편집기 사진 복원</title>
  <desc id="desc">C#에서 복원을 요청하면 FastAPI가 Replicate를 우선 사용하고 토큰이 없거나 요청이 실패하면 로컬 CPU로 복원해 결과를 돌려주는 흐름</desc>
  <style>
    text { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif; }
    .box { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; }
    .name, .section { fill: #1e293b; font-weight: 700; }
    .name { font-size: 18px; text-anchor: middle; }
    .section { font-size: 17px; }
    .detail, .label { fill: #475569; font-size: 14px; text-anchor: middle; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-linejoin: round; }
    .tip { fill: #64748b; }
    .rule { stroke: #d8e0e9; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #202d3b; stroke: #718396; }
      .name, .section { fill: #f2f6fb; }
      .detail, .label { fill: #c6d3e1; }
      .arrow { stroke: #a4b5c8; }
      .tip { fill: #a4b5c8; }
      .rule { stroke: #3d4b5a; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path class="tip" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <g transform="translate(16 63)">
    <rect class="box" width="145" height="62" rx="10"/>
    <text class="name" x="72.5" y="27">C# WinForms</text>
    <text class="detail" x="72.5" y="48">사진 복원 요청</text>
  </g>
  <g transform="translate(198 63)">
    <rect class="box" width="144" height="62" rx="10"/>
    <text class="name" x="72" y="27">FastAPI</text>
    <text class="detail" x="72" y="48">/restore-photo</text>
  </g>
  <g transform="translate(398 16)">
    <rect class="box" width="171" height="62" rx="10"/>
    <text class="name" x="85.5" y="27">Replicate</text>
    <text class="detail" x="85.5" y="48">클라우드 우선 시도</text>
  </g>
  <g transform="translate(398 110)">
    <rect class="box" width="171" height="62" rx="10"/>
    <text class="name" x="85.5" y="27">로컬 CPU</text>
    <text class="detail" x="85.5" y="48">토큰 없음 · 요청 실패 시</text>
  </g>
  <g transform="translate(620 63)">
    <rect class="box" width="154" height="62" rx="10"/>
    <text class="name" x="77" y="27">C# WinForms</text>
    <text class="detail" x="77" y="48">결과 · 복원 방식 표시</text>
  </g>
  <path class="arrow" d="M161 94 H193" marker-end="url(#tip)"/>
  <path class="arrow" d="M342 94 H362 Q369 94 369 87 V54 Q369 47 376 47 H393" marker-end="url(#tip)"/>
  <path class="arrow" d="M342 94 H362 Q369 94 369 101 V134 Q369 141 376 141 H393" marker-end="url(#tip)"/>
  <path class="arrow" d="M569 47 H585 Q592 47 592 54 V94 H615" marker-end="url(#tip)"/>
  <path class="arrow" d="M569 141 H585 Q592 141 592 134 V94"/>
</svg>
